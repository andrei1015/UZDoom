name: Arch package & release

on:
    push:
        branches: [main] # CI build on main
        tags: ["v*"] # release when tagging vX.Y.Z
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest # run steps inside Arch
        env:
            PKGDIR: . # path to PKGBUILD (change if needed)

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare build env
              run: |
                  set -eux
                  # refresh keys and packages
                  pacman -Sy --noconfirm --needed archlinux-keyring
                  pacman -Syu --noconfirm --needed base-devel git pkgconf
                  # make a non-root build user (makepkg refuses root)
                  useradd -m builder
                  chown -R builder:builder "$GITHUB_WORKSPACE"

            - name: Resolve deps & build PKGBUILD
              working-directory: ${{ env.PKGDIR }}
              run: |
                  set -eux
                  # build as the non-root user; sync deps automatically
                  sudo -u builder bash -lc '
                    cd "$GITHUB_WORKSPACE/${PKGDIR}"
                    # clean build dir, then build package(s)
                    makepkg -sfc --noconfirm
                  '

            - name: Collect artifacts
              run: |
                  mkdir -p out
                  shopt -s nullglob
                  mv $PKGDIR/*.pkg.tar.* out/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: arch-pkg
                  path: out/*.pkg.tar.*

    release:
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: arch-pkg
                  path: ./release-assets

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: ./release-assets/*.pkg.tar.*
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
